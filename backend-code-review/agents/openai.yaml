interface:
  display_name: "后端代码审查"
  short_description: "按需加载团队后端规范审查 Java/Spring/MyBatis/Rabbit-SQL/PostgreSQL 变更，输出有触发条件、定位和证据的 findings"
  default_prompt: "使用 $backend-code-review 审查当前后端变更；先确认 staged、unstaged 和相关新增文件范围，识别实际持久层框架，按需加载 reference，并按严重程度报告有证据的问题和实际验证范围。"
policy:
  allow_implicit_invocation: true
